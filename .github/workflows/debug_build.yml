name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*universal*.apk' | head -n 1)"
          test -n "$apk" || { echo "APK not found"; exit 1; }
          cp "$apk" aetheris.apk

      - name: Publish release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest aetheris.apk --prerelease \
            --title "Aetheris latest" --notes "Build ${GITHUB_SHA::7}"
